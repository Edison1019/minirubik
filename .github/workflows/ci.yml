name: C CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_h3:
        description: Run exhaustive H3 over all 3674160 states
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make check

  exhaustive-h3:
    if: github.event_name == 'workflow_dispatch' && inputs.full_h3
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: make check-h3
